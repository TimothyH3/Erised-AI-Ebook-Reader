<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- Top Title Banner -->
  <text x="500" y="48" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    ERISED AI • SYSTEM ARCHITECTURE
  </text>
  <text x="500" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
    Two-Stage Autonomous Fine-Art Literary Synthesis Pipeline
  </text>

  <!-- Document Ingestion Column -->
  <g transform="translate(40, 110)">
    <rect width="260" height="460" rx="10" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="38" rx="10" fill="#1e1b4b"/>
    <text x="130" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
      1. DOCUMENT INGESTION
    </text>

    <!-- EPUB / PDF parser -->
    <rect x="20" y="55" width="220" height="70" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="130" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">EPUB &amp; PDF Parsers</text>
    <text x="130" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">DOM/AST &amp; Metadata Extraction</text>

    <!-- Bounded Page Segmenter -->
    <rect x="20" y="145" width="220" height="70" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="130" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Semantic Page Segmenter</text>
    <text x="130" y="190" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1,800–2,400 Character Bounding</text>

    <!-- Character Codex Builder -->
    <rect x="20" y="235" width="220" height="100" rx="6" fill="#0f172a" stroke="#d97706"/>
    <text x="130" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Character Codex Engine</text>
    <text x="130" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Multi-Era Wardrobe Timeline</text>
    <text x="130" y="298" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Strict Pop-Culture Purging</text>
    <text x="130" y="315" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Zero-Name Substitution Gate</text>

    <!-- IndexedDB Storage -->
    <rect x="20" y="355" width="220" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="130" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Local IndexedDB Storage</text>
    <text x="130" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Books, Dossiers, &amp; Cached Plates</text>
  </g>

  <!-- Connectors 1 to 2 -->
  <line x1="300" y1="180" x2="370" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="370,180 362,176 362,184" fill="#f59e0b"/>

  <line x1="300" y1="285" x2="370" y2="285" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="370,285 362,281 362,289" fill="#f59e0b"/>

  <!-- AI Orchestration Column -->
  <g transform="translate(370, 110)">
    <rect width="260" height="460" rx="10" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="38" rx="10" fill="#78350f"/>
    <text x="130" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde68a" text-anchor="middle">
      2. DUAL-STAGE AI PIPELINE
    </text>

    <!-- Stage 1 -->
    <rect x="20" y="55" width="220" height="120" rx="6" fill="#0f172a" stroke="#d97706"/>
    <text x="130" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">Stage 1: Scene Director</text>
    <text x="130" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="middle">Fastest Gemini / Local LLM</text>
    <text x="130" y="120" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• Distills Climax / Setting Excerpt</text>
    <text x="130" y="136" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• Derives Lighting, Optics, Atmosphere</text>
    <text x="130" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• Formulates Dynamic Aspect Ratio</text>

    <!-- Connector down -->
    <line x1="130" y1="175" x2="130" y2="205" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="130,205 126,197 134,197" fill="#f59e0b"/>

    <!-- Prompt Gates -->
    <rect x="20" y="205" width="220" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="130" y="228" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Prompt Synthesis Gates</text>
    <text x="130" y="246" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• Page-Accurate Era Dressing</text>
    <text x="130" y="262" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• Fine-Art Style &amp; Negative Filtering</text>

    <!-- Connector down -->
    <line x1="130" y1="280" x2="130" y2="310" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="130,310 126,302 134,302" fill="#f59e0b"/>

    <!-- Stage 2 -->
    <rect x="20" y="310" width="220" height="120" rx="6" fill="#0f172a" stroke="#d97706"/>
    <text x="130" y="335" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">Stage 2: Master Artist</text>
    <text x="130" y="355" font-family="system-ui, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="middle">Google Imagen 3 (Zero-Key)</text>
    <text x="130" y="375" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Fallback: Pollinations Flux.1 (Free)</text>
    <text x="130" y="392" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• 4-Second Runtime Keep-Alive</text>
    <text x="130" y="408" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">• High-Resolution Plate Synthesis</text>
  </g>

  <!-- Connectors 2 to 3 -->
  <line x1="630" y1="370" x2="700" y2="370" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="700,370 692,366 692,374" fill="#f59e0b"/>

  <!-- Presentation Layer Column -->
  <g transform="translate(700, 110)">
    <rect width="260" height="460" rx="10" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="38" rx="10" fill="#064e3b"/>
    <text x="130" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
      3. ILLUMINATED PRESENTATION
    </text>

    <!-- Reading Sanctuary View -->
    <rect x="20" y="55" width="220" height="110" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="130" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Reading Sanctuary (reader.html)</text>
    <text x="130" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Cinzel &amp; Classical Serif Typography</text>
    <text x="130" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Justified Prose &amp; Ornate Drop-Caps</text>
    <text x="130" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Obsidian, Parchment, &amp; Paper Themes</text>
    <text x="130" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Dynamic A- / A+ Size Control</text>

    <!-- In-Page Dual-Flank Plates -->
    <rect x="20" y="185" width="220" height="110" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="130" y="210" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">In-Page Dual-Flank Plates</text>
    <text x="130" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Direct Paragraph Anchoring</text>
    <text x="130" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Golden Self-Highlighting Sweep</text>
    <text x="130" y="264" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Over-Top 'New Prompt' Hover Button</text>
    <text x="130" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Custom Highlight Art Creation</text>

    <!-- AI Studio Drawer -->
    <rect x="20" y="315" width="220" height="115" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="130" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">AI Studio &amp; Architecture Drawer</text>
    <text x="130" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Real-time Prompt Inspection &amp; Edit</text>
    <text x="130" y="378" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Character Codex Dossier Cards</text>
    <text x="130" y="394" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Whole-Book .TXT Character Scanner</text>
    <text x="130" y="410" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Lightbox Inspect &amp; Download</text>
  </g>
</svg>

